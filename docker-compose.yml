name: kakeibo

# Usage:
#   docker compose up -d                  # Infrastructure only → use with dotnet run + bun dev
#   docker compose --profile app up -d   # Full stack (infra + kakeibo-api, kakeibo-app)
#   docker compose down                   # Stop everything

services:
  # PostgreSQL 18 - Main relational database
  postgresdb:
    image: postgres:18.1-alpine
    container_name: kakeibo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"  ## internal only, access via SSH tunnel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - postgres-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis 8.4 - Distributed cache
  redis:
    image: redis:8.4-alpine
    container_name: kakeibo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"  ## internal only, access via SSH tunnel
    volumes:
      - redis-data:/data
    networks:
      - redis-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Redis Insight - Redis GUI (dev only, not needed in production)
  redis-insight:
    image: redis/redisinsight:3.0.2
    container_name: kakeibo-redis-insight
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redis-insight-data:/data
    networks:
      - redis-network
    restart: unless-stopped

  # MinIO - S3-compatible object storage (internal only, never exposed to the internet)
  minio:
    image: minio/minio:latest
    container_name: kakeibo-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"  ## internal only, access via SSH tunnel
      - "127.0.0.1:9001:9001"  ## internal only, access via SSH tunnel
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ClickHouse - Analytical database
  clickhouse:
    image: clickhouse/clickhouse-server:26.2-alpine
    container_name: kakeibo-clickhouse
    ports:
      - "127.0.0.1:8123:8123"  ## internal only, access via SSH tunnel
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./.docker/clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./.docker/clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./.docker/clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
    networks:
      - clickhouse-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Mailpit - Development email capture (dev only, not needed in production)
  mailpit:
    image: axllent/mailpit:latest
    container_name: kakeibo-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Kakeibo Email - Bun + Hono + React Email
  kakeibo-email:
    build:
      context: ./src/Kakeibo.Email
      dockerfile: Dockerfile
    container_name: kakeibo-email
    ports:
      - "3050:3050"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3050/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Aspire Dashboard - OpenTelemetry UI (optional in production)
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: kakeibo-aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"  # Dashboard UI — optional in production
      - "18889:18889"  # OTLP gRPC receiver — required in production
    restart: unless-stopped

  # =============================================================================
  # Application services — start with: docker compose --profile app up -d
  # =============================================================================

  # Kakeibo API - .NET 10 application
  kakeibo-api:
    build:
      context: .
      dockerfile: src/Kakeibo.Api/Dockerfile
    container_name: kakeibo-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: "Host=postgresdb;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Storage__Endpoint: "minio:9000"
      Storage__AccessKey: "${STORAGE_ACCESS_KEY}"
      Storage__SecretKey: "${STORAGE_SECRET_KEY}"
      Storage__UseSSL: "false"
      ClickHouse__Host: "clickhouse"
      ClickHouse__Port: "8123"
      ClickHouse__Database: "kakeibo"
      KakeiboEmail__BaseUrl: "http://kakeibo-email:3050"
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Smtp__From: "${SMTP_FROM}"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"
    ports:
      - "5000:5000"
    networks:
      - postgres-network
      - redis-network
      - clickhouse-network
      - default
    depends_on:
      postgresdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kakeibo-email:
        condition: service_healthy
    profiles:
      - app
    restart: unless-stopped

  # Kakeibo App - Vue PWA served by Nginx
  kakeibo-app:
    build:
      context: ./src/Kakeibo.App
      dockerfile: Dockerfile
    container_name: kakeibo-app
    ports:
      - "3000:80"
    depends_on:
      - kakeibo-api
    profiles:
      - app
    restart: unless-stopped

networks:
  postgres-network:
    name: kakeibo-postgres-network
  redis-network:
    name: kakeibo-redis-network
  clickhouse-network:
    name: kakeibo-clickhouse-network

volumes:
  postgres-data:
    name: kakeibo-postgres-data
  redis-data:
    name: kakeibo-redis-data
  redis-insight-data:
    name: kakeibo-redis-insight-data
  minio-data:
    name: kakeibo-minio-data
  clickhouse-data:
    name: kakeibo-clickhouse-data
  clickhouse-logs:
    name: kakeibo-clickhouse-logs
