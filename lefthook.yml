commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    oxlint:
      root: "src/Kakeibo.App/"
      glob: "*.{ts,tsx,vue,js,jsx}"
      run: bunx oxlint --deny-warnings {staged_files}

    oxfmt-check:
      root: "src/Kakeibo.App/"
      glob: "*.{ts,tsx,vue,js,jsx,css,json}"
      run: bunx oxfmt --check {staged_files}
